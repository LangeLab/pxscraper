name: Publish

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Publish target
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      ref:
        description: Git ref to build from. Use a tag like v0.5.1 for manual PyPI publishes.
        required: false
        type: string
  release:
    types: [published]

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.repository }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve publish ref
        id: publish_ref
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            ref="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ inputs.ref }}" ]]; then
            ref="${{ inputs.ref }}"
          else
            ref="${GITHUB_REF_NAME}"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.publish_ref.outputs.ref }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Validate publish ref
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        run: |
          if [[ ! "${{ steps.publish_ref.outputs.ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manual PyPI publishes must run from a release tag like v0.5.1."
            exit 1
          fi

      - name: Clean dist
        run: rm -rf dist

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0