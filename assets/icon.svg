<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="pxseek icon">
  <defs>
    <!-- Clip all lens content to the circle -->
    <clipPath id="clip">
      <circle cx="45" cy="44" r="38"/>
    </clipPath>

    <!-- Ring + handle: bright green → cyan -->
    <linearGradient id="ring" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Dark lens fill: deep forest center → near-black edge -->
    <radialGradient id="lens-bg" cx="38%" cy="34%" r="72%">
      <stop offset="0%"   stop-color="#0d2318"/>
      <stop offset="100%" stop-color="#060e0a"/>
    </radialGradient>

    <!--
      Glow for the found-result bar.
      Blurs the source and layers original on top — works in Inkscape.
    -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Lens interior ── -->
  <circle cx="45" cy="44" r="38" fill="url(#lens-bg)"/>

  <g clip-path="url(#clip)">

    <!-- Dim catalog rows above the match (unresolved records) -->
    <rect x="21" y="16" width="43" height="5.5" rx="2.75" fill="#1a4030" opacity="0.85"/>
    <rect x="21" y="25" width="31" height="5.5" rx="2.75" fill="#1a4030" opacity="0.85"/>
    <rect x="21" y="34" width="37" height="5.5" rx="2.75" fill="#1a4030" opacity="0.85"/>

    <!-- Found result row background -->
    <rect x="13" y="43" width="64" height="12" rx="4.5" fill="#052e16" opacity="0.9"/>
    <!-- ▶ selection cursor (right-pointing) -->
    <polygon points="20,49  15,45  15,53" fill="#22c55e"/>
    <!-- Matched metadata bar with glow -->
    <rect x="23" y="46.5" width="49" height="5" rx="2.5" fill="#22c55e" filter="url(#glow)"/>

    <!-- Dim catalog rows below the match -->
    <rect x="21" y="59" width="35" height="5.5" rx="2.75" fill="#1a4030" opacity="0.72"/>
    <rect x="21" y="68" width="25" height="5.5" rx="2.75" fill="#1a4030" opacity="0.5"/>
    <!-- Fade hint: more records exist beyond the lens -->
    <rect x="21" y="77" width="18" height="4.5" rx="2.25" fill="#1a4030" opacity="0.22"/>

  </g>

  <!-- Glass glint: white arc at top-left rim -->
  <path d="M 16 32 A 38 38 0 0 1 45 7"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round"
        opacity="0.16" clip-path="url(#clip)"/>

  <!-- ── Lens ring ── -->
  <circle cx="45" cy="44" r="38" fill="none"
          stroke="url(#ring)" stroke-width="5.5"/>

  <!-- ── Handle ── -->
  <line x1="74" y1="73" x2="93" y2="92"
        stroke="url(#ring)" stroke-width="8.5" stroke-linecap="round"/>

</svg>
