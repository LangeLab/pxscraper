[project]
name = "pxseek"
version = "0.5.1"
description = "Query, filter, and retrieve proteomics dataset metadata from ProteomeXchange"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Enes K. Ergin" },
    { name = "Kimia Rostin" },
    { name = "Philipp F. Lange" },
]
maintainers = [
    { name = "LangeLab" },
]
keywords = ["proteomics", "proteomexchange", "proteomecentral", "metadata", "mass-spectrometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.28",
    "click>=8.0",
    "pandas>=2.1",
    "lxml>=5.0",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://github.com/LangeLab/pxseek"
Documentation = "https://github.com/LangeLab/pxseek/wiki"
Repository = "https://github.com/LangeLab/pxseek"
Issues = "https://github.com/LangeLab/pxseek/issues"
Changelog = "https://github.com/LangeLab/pxseek/blob/main/CHANGELOG.md"

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
pxseek = "pxseek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pxseek"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
    "src/pxseek",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    ".gitignore",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
